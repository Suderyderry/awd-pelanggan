name: Build APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Pasang dependensi
        run: npm install
      - name: Buat proyek Android
        run: npx cap add android
      - name: Izin lokasi (tombol GPS pada alamat)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -c "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml
      - name: Pasang ikon logo AWD
        continue-on-error: true
        run: npx -y @capacitor/assets generate --android --iconBackgroundColor '#FFC400' --iconBackgroundColorDark '#FFC400'
      - name: Sinkronkan
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: awd-pelanggan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
