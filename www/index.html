<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1b3a"><title>AWD Pelanggan – Arjawinangun Delivery</title>
<style>
:root{--g:#2563EB;--d:#0b1b3a;--o:#F59E0B;--bg:#EEF3FB;--c:#fff;--t:#0f172a;--m:#64748b;--b:#dbe3f0;--sb:max(env(safe-area-inset-bottom,0px),18px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#050b1a;--c:#0e1a33;--t:#eef2ff;--m:#93a4c4;--b:#1d2c4d;color-scheme:dark}}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--t);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;padding-bottom:calc(132px + var(--sb))}
header{background:linear-gradient(160deg,var(--d),#1e40af);color:#fff;padding:calc(10px + max(env(safe-area-inset-top,0px),22px)) 16px 18px;border-radius:0 0 26px 26px;text-align:center}
.logo{width:150px;height:150px;border-radius:24px;box-shadow:0 8px 28px #0008;display:block;margin:0 auto 6px}
.logo.s{width:48px;height:48px;border-radius:12px;margin:0}.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.search,input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--b);background:var(--c);color:var(--t);font:inherit;margin:3px 0 9px}
.search{margin:12px 0 0;border:0}
.sec{padding:14px 16px}h3{font-size:16px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.svc{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px 4px;text-align:center;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--t)}
.svc b{display:block;font-size:26px;margin-bottom:3px}.svc.on{border-color:var(--g);background:#2563eb1c}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:12px;cursor:pointer}
.ico{width:52px;height:52px;border-radius:12px;background:#2563eb22;display:grid;place-items:center;font-size:27px;flex:none}
.m{color:var(--m);font-size:12px}.tag{color:var(--g);font-weight:700}.err{color:#dc2626;font-size:12px;margin:-4px 0 8px}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700;width:100%;cursor:pointer;font:700 14px system-ui;margin-top:6px}
.btn.o{background:var(--o);color:#1c1300}.btn.l{background:none;color:var(--g);border:1px solid var(--g)}.btn.s{width:auto;padding:7px 14px;border-radius:99px;margin:0}
nav{position:fixed;bottom:0;width:100%;max-width:480px;background:var(--c);border-top:1px solid var(--b);padding:8px 0 0;z-index:5}.nb{display:flex}.by{text-align:center;font-size:14px;font-weight:700;color:var(--m);padding:6px 0 calc(var(--sb) + 8px)}
nav button{flex:1;border:0;background:none;color:var(--m);font-size:11.5px;padding:4px;cursor:pointer}nav b{display:block;font-size:22px}nav .on{color:var(--g);font-weight:700}
#ov{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:10}#ov.show{display:flex}
#sheet{background:var(--c);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--sb))}
.fab{position:fixed;bottom:calc(142px + var(--sb));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;z-index:6}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--g);background:none;color:var(--g);font-size:17px}
.line{display:flex;justify-content:space-between;padding:3px 0}.tot{font-weight:800;font-size:16px;border-top:1px dashed var(--b);margin-top:6px;padding-top:8px}
.opt{border:1px solid var(--b);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;display:inline-block;margin-right:6px}.opt.on{border-color:var(--g);background:#2563eb1c;font-weight:700}.opt.blk{display:block;margin-right:0}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:99px;z-index:20;opacity:0;transition:.3s;pointer-events:none;max-width:90%}#toast.show{opacity:1}
.bar{height:8px;border-radius:9px;background:var(--b);overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:width .5s}
.x{float:right;border:0;background:var(--b);color:var(--t);border-radius:50%;width:32px;height:32px}.req:after{content:" *";color:#dc2626}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;margin:4px 0;background:var(--bg)}.msg.me{background:var(--g);color:#fff;margin-left:auto}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pc{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}.pe{font-size:78px;line-height:1.1;text-align:center;background:#2563eb14;border-radius:12px;margin-bottom:8px;padding:16px 6px;cursor:zoom-in}.pd{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.shl{color:var(--g);font-size:12px;font-weight:600;cursor:pointer;margin-top:2px;display:block}.pc{cursor:pointer}.bw{position:relative}.ba{position:absolute;top:44px;width:34px;height:34px;border-radius:50%;border:0;background:#0008;color:#fff;font-size:22px;line-height:1;cursor:pointer;z-index:2}.ba.l{left:22px}.ba.r{right:22px}.bd{display:flex;justify-content:center;gap:6px;margin-top:8px}.bd i{width:7px;height:7px;border-radius:50%;background:var(--b);transition:.3s}.bd i.on{background:var(--g);width:18px}#bn{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-overflow-scrolling:touch}#bn{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:14px 16px 0;scrollbar-width:none}#bn::-webkit-scrollbar{display:none}.bn{flex:0 0 100%;scroll-snap-align:center;border-radius:16px;padding:20px 18px;color:#fff;cursor:pointer}.st{font-size:22px;cursor:pointer;color:#f59e0b}
.card{box-shadow:0 1px 4px #0b1b3a14}.svc{box-shadow:0 1px 4px #0b1b3a14}.svc b{background:#2563eb14;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin:0 auto 6px}nav{box-shadow:0 -4px 16px #0b1b3a14}.btn{box-shadow:0 2px 6px #2563eb40}h3{letter-spacing:-.2px}
.ad{padding:16px;max-width:1000px;margin:auto}.cols{display:grid;gap:16px;grid-template-columns:1fr}@media(min-width:820px){.cols{grid-template-columns:1fr 380px}.pvw{position:sticky;top:10px;align-self:start}}.phn{border:8px solid #111;border-radius:28px;overflow:hidden;background:var(--bg);max-width:380px;margin:auto}.ad input[type=color]{height:44px;padding:3px}.ad input[type=range]{padding:0}.step{display:flex;gap:6px;margin-bottom:12px}.step i{flex:1;height:5px;border-radius:9px;background:var(--b)}.step i.on{background:var(--g)}
header{position:relative}
.bell{position:absolute;top:calc(8px + max(env(safe-area-inset-top,0px),22px));right:12px;width:42px;height:42px;border-radius:50%;border:0;background:#ffffff38;color:#fff;font-size:20px;cursor:pointer;z-index:3;display:grid;place-items:center;padding:0}
.bell i{position:absolute;top:-3px;right:-3px;background:#ef4444;color:#fff;font:700 10px system-ui;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-style:normal;border:2px solid #fff}
.grid{grid-auto-rows:96px}.svc{display:flex;flex-direction:column;align-items:center;justify-content:center}
.svc.img{padding:0;overflow:hidden}.svc.img img{width:100%;height:100%;object-fit:cover;display:block}.svc.img.on{outline:3px solid var(--g);outline-offset:-3px}
#bn{align-items:flex-start}.bn.bi{padding:0;background:#0b1b3a;overflow:hidden;line-height:0}.bn.bi img{width:100%;height:auto;display:block;-webkit-user-drag:none;user-select:none}
.nf{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--b)}.nf.u{background:#2563eb14;margin:0 -8px;padding:10px 8px;border-radius:12px}.nf b{display:block}
.cs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}.cs span{background:#2563eb1c;color:var(--g);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.ch{white-space:nowrap;overflow-x:auto;display:flex;gap:6px;margin:8px 0 12px}.ch button{border:1px solid var(--b);background:var(--c);color:var(--t);padding:6px 12px;border-radius:99px;font:600 12px system-ui;flex:none;cursor:pointer}.ch button.on{background:var(--g);color:#fff;border-color:var(--g)}
.mb{background:#ef4444;color:#fff;border-radius:99px;font:700 10px system-ui;padding:2px 7px;margin-left:6px}
.mapb{position:relative;height:210px;border-radius:14px;overflow:hidden;background:#dbe3f0;margin:8px 0}
</style></head><body><div id="app"></div><div id="ov"><div id="sheet"></div></div><div id="toast"></div>

S.user={id:SES.user.id,name:p.name,hp:p.hp,email:(p.x||{}).email||'',foto:p.photo||'',addrs:Array.isArray(p.alamat)?p.alamat:[],status:'aktif'};await loadOrders()}catch(e){SES=null;saveSes()}}
async function loadOrders(q){if(!(remote()&&SES&&S.user&&S.user.id))return;try{const o=await sb('/rest/v1/rpc/awd_pesanan_saya',{m:'POST',b:{}}),rv=await sb('/rest/v1/ulasan?produk_id=is.null&pesanan_id=not.is.null&select=pesanan_id,bintang,komentar&pengguna_uid=eq.'+S.user.id).catch(()=>[]);
S.orders=(o||[]).map(r=>{const q=rv.find(z=>z.pesanan_id==r.id);return{id:r.id,rid:r.id,m:r.m,items:(r.items||[]).reduce((a,b)=>a+(b.q||1),0)||1,total:r.p,pay:r.pay,st:SM[String(r.s).toLowerCase()]??0,rv:q?[q.bintang,q.komentar||'']:null,to:(r.adr||{}).street||''}});ordNotif(o||[]);const js=JSON.stringify(S.orders);if(!q||(S.tab=='act'&&js!=LASTORD))render();LASTORD=js}catch(e){}}
function syncAddr(a){sb('/rest/v1/rpc/awd_simpan_alamat',{m:'POST',b:{a:S.user.addrs}}).catch(()=>toast('Alamat belum tersinkron ke server'))}
function pushOrd(o,svc){if(!(remote()&&SES))return;sb('/rest/v1/rpc/awd_pesan',{m:'POST',b:{p:{layanan:svc,nama:o.m,total:o.total,metode:o.pay,alamat:{street:o.to||''}}}}).then(r=>{o.rid=r.id;o.id=r.id;save();render()}).catch(e=>toast('Pesanan belum terkirim ke server: '+e.message))}
async function rLogin(){const hp=V('lh'),pw=V('lp');if(!/^08\d{8,12}$/.test(hp))return er('Nomor HP tidak valid');try{const c=SBC(),r=await fetch(c.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:hd(c),body:JSON.stringify({email:hp+'@'+c.domain,password:pw})}),j=await r.json();if(!r.ok)return er('Nomor HP atau kata sandi salah');SES=j;saveSes();await restoreUser();if(!S.user)return er('Akun belum bisa dimuat dari server');closeS();render();toast('Selamat datang, '+S.user.name);pollNotif();if(pend){const f=pend;pend=null;f()}}catch(e){er('Tidak dapat terhubung ke server')}}
async function rReg(){try{const c=SBC(),r=await fetch(c.url+'/auth/v1/signup',{method:'POST',headers:hd(c),body:JSON.stringify({email:R.hp+'@'+c.domain,password:R.pw,data:{name:R.name}})}),j=await r.json(),ms=j.msg||j.message||j.error_description||'';if(!r.ok)return er(/already/i.test(ms)?'Nomor sudah terdaftar, silakan masuk':(ms||'Pendaftaran gagal'));if(!j.access_token)return er('Server meminta konfirmasi email. Nonaktifkan "Confirm email" di Supabase Auth.');SES=j;saveSes();
await sb('/rest/v1/rpc/awd_daftar',{m:'POST',b:{p:{nama:R.name.trim(),hp:R.hp,email:R.email||'',foto:R.foto||''}}});await restoreUser();render();authS('addr');toast('Akun aktif! Lengkapi alamat utama')}catch(e){er('Gagal terhubung: '+e.message)}}
function shrink(f,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)}
const ptl=(x,big)=>x[4]?`<img src="${esc(x[4])}" alt="" style="width:100%;height:100%;object-fit:cover">`:x[2];
function zp(id,i){const x=mc(id).menu[i];x[4]?zoom(`<img src="${esc(x[4])}" alt="" style="max-width:100%;max-height:90vh;border-radius:14px">`):zemo(x[2])}
function srvS(){const c=SBC();sheet(`<h3>⚙️ Pengaturan Server</h3><p class="m">Terhubung ke Supabase panel admin AWD.</p><label class="m">Project URL</label><input id="su" value="${esc(c.url)}"><label class="m">Publishable / anon key</label><input id="sk" value="${esc(c.key)}"><div class="err" id="er"></div><button class="btn" onclick="srvSave()">Uji & Simpan</button><button class="btn l" onclick="srvOff()">Pakai pengaturan bawaan</button>`)}
async function srvSave(){const u=V('su').trim().replace(/\/$/,''),k=V('sk').trim();if(!/^https:\/\//.test(u)||!k)return er('Isi URL (https://…) dan key');try{const r=await fetch(u+'/rest/v1/awd_pengaturan?select=kunci&limit=1',{headers:hd({key:k})});if(!r.ok)throw new Error('HTTP '+r.status+' (jalankan skrip SQL dulu)');localStorage.setItem('awd_sb',JSON.stringify({url:u,key:k}));LASTJS='';closeS();toast('Terhubung ke server');await loadRemote()}catch(e){er('Gagal: '+e.message)}}
function srvOff(){try{localStorage.removeItem('awd_sb')}catch(e){}SES=null;saveSes();LASTJS='';closeS();location.reload()}
let lt=0,lc=0;function logoTap(){const n=Date.now();lc=n-lt<1500?lc+1:1;lt=n;if(lc>=7){lc=0;srvS()}}
async function boot(){if(!remote())return;await loadRemote();if(SES&&!S.user){await restoreUser();render()}pollNotif()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&remote()&&!$('#ov.show'))loadRemote(1)});
setInterval(()=>{if(remote()&&!document.hidden&&!$('#ov.show'))loadRemote(1)},120000);
/* ---------- KIRIM & PULSA ---------- */
function kirim(){need(()=>{sheet(`<h3>📦 AWD Kirim</h3><label class="m">Alamat jemput</label><input id="kj" placeholder="Jl… Desa…"><label class="m">Alamat tujuan</label><input id="kt2" placeholder="Jl… Desa…"><label class="m">Jarak (km)</label><input id="km" type="number" value="3" min="1" oninput="kc()"><div class="line tot"><span>Tarif</span><span id="kt"></span></div><p class="m">Tarif dasar ${rp(TR.d)} + ${rp(TR.p)}/km setelah ${TR.k0} km pertama.</p><button class="btn" onclick="ksend()">Pesan Kurir (COD)</button>`);kc()})}
const TR={d:8000,k0:1,p:2500},kf=()=>TR.d+TR.p*Math.max(0,V('km')-TR.k0);function kc(){$('#kt').textContent=rp(kf())}
function ksend(){if(!V('kj')||!V('kt2'))return toast('Isi alamat jemput & tujuan');S.orders.unshift({id:'AWD'+(1000+S.orders.length+1),m:'AWD Kirim',items:1,total:kf(),pay:'cod',st:0,rv:null,to:V('kt2')});pushOrd(S.orders[0],'kirim');save();closeS();render();track(S.orders[0].id)}
function ppob(){need(()=>{sheet(`<h3>📱 AWD Pulsa & Data</h3><label class="m">Nomor HP tujuan</label><input id="pn" type="tel" value="${S.user.hp}">${[['Pulsa 10.000',12000],['Pulsa 25.000',27000],['Pulsa 50.000',52000],['Data 5 GB',45000],['Data 15 GB',85000]].map(p=>`<div class="opt blk" onclick="pbuy('${p[0]}',${p[1]})">${p[0]} · <b>${rp(p[1])}</b></div>`).join('')}`)})}
function pbuy(n,p){if(!/^08\d{8,12}$/.test(V('pn')))return toast('Nomor HP tidak valid');S.orders.unshift({id:'AWD'+(1000+S.orders.length+1),m:n+' → '+V('pn'),items:1,total:p,pay:'qris',st:3,rv:null});pushOrd(S.orders[0],'pulsa');save();closeS();render();toast('Transaksi berhasil')}

/* ===== NOTIFIKASI (lonceng): promo/pengumuman panel, status pesanan, pesan toko ===== */
let LASTORD='',LASTCH='',CHL=[];
const nfKey=()=>'awd_nf_'+(S.user?S.user.hp:'tamu');
const nfGet=()=>{try{return JSON.parse(localStorage.getItem(nfKey())||'[]')}catch(e){return[]}};
const nfPut=a=>{try{localStorage.setItem(nfKey(),JSON.stringify(a.slice(0,60)))}catch(e){}};
const nfN=()=>nfGet().filter(x=>!x.r).length;
function bell(){const n=nfN();return `<button class="bell" onclick="notifS()" aria-label="Notifikasi${n?', '+n+' belum dibaca':''}">🔔${n?`<i>${n>9?'9+':n}</i>`:''}</button>`}
function bellUpd(){const n=nfN();document.querySelectorAll('.bell').forEach(b=>{b.innerHTML='🔔'+(n?`<i>${n>9?'9+':n}</i>`:'')})}
function nfAdd(k,ic,t,d,quiet){const a=nfGet();if(a.some(x=>x.k==k))return false;a.unshift({k,ic,t,d:d||'',at:Date.now(),r:quiet?1:0});nfPut(a);if(!quiet){bellUpd();toast(ic+' '+t)}return true}
function notifS(){const a=nfGet(),fm=t=>new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
sheet(`<h3>🔔 Notifikasi</h3>${a.map(x=>`<div class="nf ${x.r?'':'u'}"><div class="ico" style="width:40px;height:40px;font-size:20px">${x.ic}</div><div style="flex:1;min-width:0"><b>${esc(x.t)}</b><div class="m">${esc(x.d)}</div><div class="m" style="font-size:10px">${fm(x.at)}</div></div></div>`).join('')||'<p class="m">Belum ada notifikasi. Promo, pesan toko, dan status pesanan muncul di sini.</p>'}`);
nfPut(a.map(x=>({...x,r:1})));bellUpd()}
const OSTX={1:['👨‍🍳','Pesanan diproses','Toko sedang menyiapkan pesananmu'],2:['🛵','Pesanan diantar','Driver sedang menuju lokasimu'],3:['🎉','Pesanan sudah sampai','Selamat menikmati! Jangan lupa beri ulasan']};
function ordNotif(rs){if(!S.user)return;const k='awd_ost_'+S.user.hp;let m={};try{m=JSON.parse(localStorage.getItem(k)||'{}')}catch(e){}
rs.forEach(r=>{const raw=String(r.s).toLowerCase(),c=raw=='dibatalkan'?9:(SM[raw]??0);if(m[r.id]!=null&&m[r.id]!=c){const x=c==9?['❌','Pesanan dibatalkan','Pesanan '+r.id+' dibatalkan oleh toko']:OSTX[c];if(x)nfAdd('o:'+r.id+':'+c,x[0],x[1],c==9?x[2]:x[2]+' ('+r.id+')')}m[r.id]=c});
try{localStorage.setItem(k,JSON.stringify(m))}catch(e){}}
function promoNf(l){const k=nfKey()+'_p',base=!localStorage.getItem(k);l.forEach(b=>{if(b[1])nfAdd('p:'+b[1],'🎁','Promo: '+b[1],b[2]||'',base)});try{localStorage.setItem(k,'1')}catch(e){}bellUpd()}
async function pollNotif(){if(!remote()||document.hidden)return;try{
const nt=await sb('/rest/v1/awd_notif?select=*&order=id.asc').catch(()=>null);
if(nt){const k=nfKey()+'_i',base=!localStorage.getItem(k);nt.forEach(n=>nfAdd('a:'+n.judul,'📢',n.judul,n.waktu||'',base));try{localStorage.setItem(k,'1')}catch(e){}}
if(SES&&S.user){await loadOrders(1);await loadChats(1)}bellUpd()}catch(e){}}
setInterval(()=>{if(!$('#ov.show'))pollNotif()},20000);

/* ===== CHAT DENGAN TOKO ===== */
async function loadChats(q){if(!(remote()&&SES&&S.user))return;try{const l=await sb('/rest/v1/rpc/awd_chat_daftar',{m:'POST',b:{}});CHL=l||[];
CHL.forEach(c=>{if(c.belum>0&&c.dari=='toko')nfAdd('c:'+c.mid+':'+c.id,'💬','Pesan dari '+c.nama,c.isi)});
const js=JSON.stringify(CHL);if((!q||(S.tab=='chat'&&js!=LASTCH))&&S.tab=='chat')render();LASTCH=js}catch(e){}}
function shopChat(mid){need(()=>{if(!(remote()&&SES&&REMSHOP))return toast('Chat toko tersedia setelah terhubung ke server');chatShop(mid)})}
function chatShop(mid){const nm=(mc(mid)||{}).n||(CHL.find(c=>c.mid==mid)||{}).nama||'Toko';
sheet(`<h3>💬 ${esc(nm)}</h3><div id="ms" data-m="${esc(mid)}" style="max-height:44vh;overflow:auto"><p class="m">Memuat…</p></div><input id="cm" placeholder="Tulis pesan ke toko…" onkeydown="if(event.key=='Enter')sendShop('${esc(mid)}')"><button class="btn" onclick="sendShop('${esc(mid)}')">Kirim</button>`);
chatPoll(mid);clearInterval(ctm);ctm=setInterval(()=>chatPoll(mid),4000)}
async function chatPoll(mid){const el=$('#ms');if(!el||el.dataset.m!=mid){clearInterval(ctm);return}
try{const L=await sb('/rest/v1/rpc/awd_chat_baca',{m:'POST',b:{p_merchant:mid}})||[],js=JSON.stringify(L);if(el.dataset.k==js)return;el.dataset.k=js;
el.innerHTML=L.length?L.map(x=>`<div class="msg ${x.dari=='pelanggan'?'me':''}">${esc(x.isi)}<div class="m" style="font-size:10px;opacity:.7">${esc(x.at)}</div></div>`).join(''):'<p class="m">Belum ada pesan. Tanyakan stok, menu, atau jam buka.</p>';el.scrollTop=el.scrollHeight;loadChats(1)}catch(e){}}
async function sendShop(mid){const t=V('cm').trim();if(!t)return;try{await sb('/rest/v1/rpc/awd_chat_kirim',{m:'POST',b:{p_merchant:mid,p_isi:t}});$('#cm').value='';chatPoll(mid)}catch(e){toast('Gagal mengirim: '+e.message)}}

/* ===== PETA / LOKASI DRIVER (tile OpenStreetMap, tanpa pustaka tambahan) ===== */
const llv=o=>o&&o.lat!=null&&o.lng!=null&&isFinite(+o.lat)&&isFinite(+o.lng)?{lat:+o.lat,lng:+o.lng}:null;
function trkPts(r){if(!r)return[];return[[r.toko,'🏪','Toko'],[r.tujuan,'🏠','Tujuan'],[r.drv,'🛵',r.d||'Driver']].map(a=>{const q=llv(a[0]);return q?{...q,e:a[1],l:a[2]}:null}).filter(Boolean)}
function drawMap(id,pts){const el=$('#'+id);if(!el)return;const key=JSON.stringify(pts);if(el.dataset.k==key)return;el.dataset.k=key;
if(!pts.length){el.innerHTML='<div class="m" style="display:grid;place-items:center;height:100%;text-align:center;padding:14px">Lokasi belum tersedia. Peta muncul setelah toko, alamat tujuan, atau driver punya titik lokasi.</div>';return}
const W=el.clientWidth||320,H=el.clientHeight||210,P=36,n0=z=>Math.pow(2,z)*256,mx=(g,z)=>(g+180)/360*n0(z),my=(a,z)=>{const r=a*Math.PI/180;return(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n0(z)};
let z=17;for(;z>9;z--){const xs=pts.map(p=>mx(p.lng,z)),ys=pts.map(p=>my(p.lat,z));if(Math.max(...xs)-Math.min(...xs)<=W-2*P&&Math.max(...ys)-Math.min(...ys)<=H-2*P)break}
const xs=pts.map(p=>mx(p.lng,z)),ys=pts.map(p=>my(p.lat,z)),ox=(Math.min(...xs)+Math.max(...xs))/2-W/2,oy=(Math.min(...ys)+Math.max(...ys))/2-H/2,n=Math.pow(2,z);
let t='';for(let tx=Math.floor(ox/256);tx<=Math.floor((ox+W)/256);tx++)for(let ty=Math.floor(oy/256);ty<=Math.floor((oy+H)/256);ty++){if(ty<0||ty>=n)continue;t+=`<img src="https://tile.openstreetmap.org/${z}/${((tx%n)+n)%n}/${ty}.png" alt="" draggable="false" style="position:absolute;left:${tx*256-ox}px;top:${ty*256-oy}px;width:256px;height:256px;max-width:none">`}
const mk=pts.map(p=>`<div style="position:absolute;left:${mx(p.lng,z)-ox}px;top:${my(p.lat,z)-oy}px;transform:translate(-50%,-100%);text-align:center;pointer-events:none"><div style="font-size:26px;line-height:1;filter:drop-shadow(0 2px 3px #0008)">${p.e}</div><div style="font:700 10px system-ui;background:#fff;color:#0f172a;border-radius:6px;padding:1px 5px;margin-top:2px;white-space:nowrap;box-shadow:0 1px 3px #0004">${esc(p.l)}</div></div>`).join('');
el.innerHTML=t+mk+'<div style="position:absolute;right:4px;bottom:2px;font:9px system-ui;background:#fffc;padding:0 4px;border-radius:4px;color:#334">© OpenStreetMap</div>'}
async function lacakMap(pid,id){try{const r=await sb('/rest/v1/rpc/awd_lacak',{m:'POST',b:{pid}});drawMap(id,trkPts(r))}catch(e){drawMap(id,[])}}
const aoa=()=>S.orders.find(o=>o.rid&&o.st<3);
function amc(){const o=aoa();return o&&remote()?`<div class="card" style="display:block;cursor:default"><div class="row sp"><b>📍 Lokasi pesanan ${esc(o.id)}</b><span class="tag">${ST[o.st]||''}</span></div><div id="mpa" class="mapb"></div></div>`:''}
function actMap(){const o=aoa();if(o&&remote())lacakMap(o.rid,'mpa')}
setInterval(()=>{if(S.tab=='act'&&!$('#ov.show'))actMap()},10000);
render();boot();
</script></body></html>
